<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>釜山同行攻略｜已作废</title>
  <style>
    :root{color-scheme:light dark;--sea:#0d667b;--paper:#f3f6f3;--card:#fff;--ink:#1e3038;--muted:#69767c;--line:#d7e0dd}
    @media(prefers-color-scheme:dark){:root{--paper:#101b21;--card:#17262d;--ink:#edf2f3;--muted:#a4b1b6;--line:#31444b}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 80% 0,rgba(85,168,184,.25),transparent 38%),var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(100%,440px);padding:30px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 20px 60px rgba(20,45,54,.12)}.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sea);font-weight:800}h1{margin:.35em 0 .3em;font:800 1.8rem/1.25 ui-serif,Georgia,"Songti SC",serif}p{color:var(--muted);line-height:1.65}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Busan · Trip Complete</div>
    <h1>本次行程页面已作废</h1>
    <p>为保护同行人的个人与住宿信息，页面已在行程结束后停止访问。</p>
  </main>
</body>
</html>
