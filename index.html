const form=document.getElementById("unlock-form");
const input=document.getElementById("password");
const button=document.getElementById("unlock");
const error=document.getElementById("error");
const bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
form.addEventListener("submit",async event=>{
  event.preventDefault();
  error.textContent="";button.disabled=true;button.textContent="正在解锁…";
  try{
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(input.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(PAYLOAD.salt),iterations:PAYLOAD.iterations,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plaintext=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(PAYLOAD.nonce),tagLength:128},key,bytes(PAYLOAD.ciphertext));
    const html=new TextDecoder().decode(plaintext);
    document.open();document.write(html);document.close();
  }catch(_){
    input.value="";input.focus();error.textContent="密码不正确，请重试。";
    button.disabled=false;button.textContent="解锁攻略";
  }
});
</script>
